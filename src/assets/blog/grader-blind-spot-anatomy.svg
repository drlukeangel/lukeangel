<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Anatomy of the blind spot">
  <rect x="1" y="1" width="998" height="458" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:14px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;fill:#5b616b}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>

  <text class="h" x="36" y="40">what the 229 checks verify</text>
  <text class="h" x="596" y="40">what none of them ask</text>
  <path d="M560 20 L560 340" stroke="#1a1d24" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 6"/>

  <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5">
    <rect x="36" y="58" width="490" height="38" rx="6"/>
    <rect x="36" y="106" width="490" height="38" rx="6"/>
    <rect x="36" y="154" width="490" height="38" rx="6"/>
    <rect x="36" y="202" width="490" height="38" rx="6"/>
    <rect x="36" y="250" width="490" height="38" rx="6"/>
  </g>
  <text class="l" x="58" y="83">class and table declarations</text>
  <text class="l" x="58" y="131">column definitions and types</text>
  <text class="l" x="58" y="179">relationship declarations</text>
  <text class="l" x="58" y="227">route registrations</text>
  <text class="l" x="58" y="275">imports and function signatures</text>
  <g class="s" fill="#7a808c">
    <text x="392" y="83">at rest</text><text x="392" y="131">at rest</text><text x="392" y="179">at rest</text>
    <text x="392" y="227">at rest</text><text x="392" y="275">at rest</text>
  </g>

  <rect x="596" y="58" width="368" height="182" rx="8" fill="#fdfaf2" stroke="#c14a3a" stroke-width="2.5"/>
  <text class="l" x="618" y="90">create a record</text>
  <text class="l" x="618" y="122">attach it to another record</text>
  <text class="l" x="618" y="154">remove the first one</text>
  <text class="l" x="618" y="186">now look at what survived</text>
  <text class="s" x="618" y="220" fill="#c14a3a">zero checks change state and then look</text>

  <rect x="596" y="252" width="368" height="88" rx="8" fill="#6b8f2e" fill-opacity="0.14" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="h" x="618" y="282">15 behavioural probes</text>
  <text class="s" x="618" y="306">kept outside every workspace</text>
  <text class="s" x="618" y="326">found it in seconds</text>

  <text class="c" x="36" y="380">A suite can be enormous along one axis and have no extent at all along another.</text>
  <text class="c" x="36" y="410">Exhaustive is about count. Blind is about kind.</text>
</svg>
