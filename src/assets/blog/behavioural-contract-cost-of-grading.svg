<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Cost of grading">
  <rect x="1" y="1" width="998" height="438" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:14px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;fill:#5b616b}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>

  <!-- upper timeline -->
  <text class="h" x="36" y="46">28 seconds — runs at round boundaries</text>
  <path d="M36 92 L964 92" stroke="#1a1d24" stroke-opacity="0.3" stroke-width="2.5"/>
  <g fill="#7a808c" fill-opacity="0.45">
    <rect x="60" y="76" width="16" height="32" rx="4"/><rect x="104" y="76" width="16" height="32" rx="4"/>
    <rect x="148" y="76" width="16" height="32" rx="4"/><rect x="192" y="76" width="16" height="32" rx="4"/>
    <rect x="236" y="76" width="16" height="32" rx="4"/><rect x="280" y="76" width="16" height="32" rx="4"/>
    <rect x="324" y="76" width="16" height="32" rx="4"/><rect x="368" y="76" width="16" height="32" rx="4"/>
    <rect x="412" y="76" width="16" height="32" rx="4"/><rect x="456" y="76" width="16" height="32" rx="4"/>
  </g>
  <rect x="148" y="70" width="16" height="44" rx="4" fill="#c14a3a" fill-opacity="0.8"/>
  <text class="s" x="112" y="136" fill="#c14a3a">defect introduced here</text>
  <rect x="500" y="64" width="120" height="56" rx="7" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="518" y="88">grade</text>
  <text class="s" x="518" y="108">28s</text>
  <text class="s" x="640" y="98" fill="#c14a3a">caught here — 8 edits later</text>

  <!-- lower timeline -->
  <text class="h" x="36" y="222">2 seconds — runs after every edit</text>
  <path d="M36 268 L964 268" stroke="#1a1d24" stroke-opacity="0.3" stroke-width="2.5"/>
  <g fill="#6b8f2e" fill-opacity="0.55">
    <rect x="60" y="252" width="16" height="32" rx="4"/><rect x="104" y="252" width="16" height="32" rx="4"/>
    <rect x="148" y="252" width="16" height="32" rx="4"/><rect x="192" y="252" width="16" height="32" rx="4"/>
    <rect x="236" y="252" width="16" height="32" rx="4"/><rect x="280" y="252" width="16" height="32" rx="4"/>
  </g>
  <rect x="148" y="246" width="16" height="44" rx="4" fill="#c14a3a" fill-opacity="0.8"/>
  <g fill="#1a1d24" fill-opacity="0.5">
    <circle cx="90" cy="300" r="4"/><circle cx="134" cy="300" r="4"/><circle cx="178" cy="300" r="4"/>
    <circle cx="222" cy="300" r="4"/><circle cx="266" cy="300" r="4"/>
  </g>
  <text class="s" x="36" y="326">a 2s grade after each one</text>
  <path d="M178 292 L178 276" stroke="#3a7d44" stroke-width="2.5"/>
  <text class="s" x="196" y="240" fill="#3a7d44">caught on the next tick, handed straight back</text>

  <rect x="36" y="348" width="928" height="56" rx="8" fill="#6b8f2e" fill-opacity="0.12" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="l" x="58" y="374">the second one is not just faster — it is a different mechanism</text>
  <text class="s" x="58" y="394">a grader cheap enough to run continuously stops being a report card and becomes a feedback signal</text>
</svg>
