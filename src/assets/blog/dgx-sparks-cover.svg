<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Two Sparks">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <!-- constellation of nine model nodes feeding down into the pair -->
  <g stroke="#7a808c" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M232 128 L438 326"/>
    <path d="M352 92  L484 328"/>
    <path d="M470 118 L528 330"/>
    <path d="M598 86  L566 330"/>
    <path d="M712 120 L676 330"/>
    <path d="M836 96  L730 330"/>
    <path d="M944 140 L800 328"/>
    <path d="M300 210 L470 332"/>
    <path d="M900 226 L768 334"/>
  </g>

  <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.4">
    <circle cx="232" cy="128" r="15"/>
    <circle cx="352" cy="92"  r="11"/>
    <circle cx="470" cy="118" r="13"/>
    <circle cx="598" cy="86"  r="18"/>
    <circle cx="712" cy="120" r="12"/>
    <circle cx="836" cy="96"  r="15"/>
    <circle cx="944" cy="140" r="11"/>
    <circle cx="300" cy="210" r="9"/>
    <circle cx="900" cy="226" r="9"/>
  </g>
  <g fill="#6b8f2e">
    <circle cx="598" cy="86" r="7"/>
    <circle cx="232" cy="128" r="6"/>
  </g>

  <g transform="translate(0,30) translate(621,382) scale(1.12) translate(-621,-382)">

  <!-- left box -->
  <g>
    <path d="M392 330 L560 330 L590 306 L422 306 Z" fill="#eceadf" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <rect x="392" y="330" width="168" height="128" rx="9" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3"/>
    <path d="M560 330 L590 306 L590 434 L560 458 Z" fill="#e4e2d6" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#6b8f2e">
      <rect x="416" y="356" width="66" height="7" rx="3.5"/>
      <rect x="416" y="374" width="44" height="7" rx="3.5"/>
      <rect x="416" y="392" width="82" height="7" rx="3.5"/>
    </g>
    <g fill="#7a808c" fill-opacity="0.55">
      <rect x="416" y="410" width="30" height="7" rx="3.5"/>
      <rect x="416" y="428" width="52" height="7" rx="3.5"/>
    </g>
    <g fill="#1a1d24" fill-opacity="0.35">
      <circle cx="530" cy="440" r="4"/>
      <circle cx="546" cy="440" r="4"/>
    </g>
  </g>

  <!-- right box -->
  <g>
    <path d="M652 330 L820 330 L850 306 L682 306 Z" fill="#eceadf" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <rect x="652" y="330" width="168" height="128" rx="9" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3"/>
    <path d="M820 330 L850 306 L850 434 L820 458 Z" fill="#e4e2d6" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#6b8f2e">
      <rect x="676" y="356" width="52" height="7" rx="3.5"/>
      <rect x="676" y="374" width="74" height="7" rx="3.5"/>
    </g>
    <g fill="#7a808c" fill-opacity="0.55">
      <rect x="676" y="392" width="38" height="7" rx="3.5"/>
      <rect x="676" y="410" width="62" height="7" rx="3.5"/>
      <rect x="676" y="428" width="44" height="7" rx="3.5"/>
    </g>
    <g fill="#1a1d24" fill-opacity="0.35">
      <circle cx="790" cy="440" r="4"/>
      <circle cx="806" cy="440" r="4"/>
    </g>
  </g>

  <!-- the interconnect between them -->
  <path d="M590 392 C614 392 628 392 652 392" stroke="#1a1d24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="621" cy="392" r="8" fill="#6b8f2e" stroke="#1a1d24" stroke-width="2.5"/>

  <!-- desk line -->
  <path d="M300 500 L940 500" stroke="#1a1d24" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#1a1d24" fill-opacity="0.07">
    <path d="M392 458 L590 458 L590 468 L392 468 Z"/>
    <path d="M652 458 L850 458 L850 468 L652 468 Z"/>
  </g>

  </g>
</svg>
