<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cost per fix">
  <defs>
    <pattern id="db" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#db)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <!-- descending cost bars -->
  <path d="M180 372 L700 372" stroke="#1a1d24" stroke-opacity="0.3" stroke-width="3"/>
  <g stroke="#1a1d24" stroke-width="3.5">
    <rect x="200" y="132" width="88" height="240" fill="#6b8f2e" fill-opacity="0.7"/>
    <rect x="332" y="294" width="88" height="78" fill="#6b8f2e" fill-opacity="0.55"/>
    <rect x="464" y="308" width="88" height="64" fill="#6b8f2e" fill-opacity="0.42"/>
    <rect x="596" y="318" width="88" height="54" fill="#6b8f2e" fill-opacity="0.32"/>
  </g>

  <!-- one agent by the tall bar -->
  <circle cx="244" cy="424" r="13" fill="#6b8f2e" stroke="#1a1d24" stroke-width="3"/>

  <!-- sixteen by the short bar -->
  <g fill="#6b8f2e" stroke="#1a1d24" stroke-width="2">
    <circle cx="608" cy="410" r="8"/><circle cx="630" cy="410" r="8"/><circle cx="652" cy="410" r="8"/><circle cx="674" cy="410" r="8"/>
    <circle cx="608" cy="432" r="8"/><circle cx="630" cy="432" r="8"/><circle cx="652" cy="432" r="8"/><circle cx="674" cy="432" r="8"/>
    <circle cx="608" cy="454" r="8"/><circle cx="630" cy="454" r="8"/><circle cx="652" cy="454" r="8"/><circle cx="674" cy="454" r="8"/>
    <circle cx="608" cy="476" r="8"/><circle cx="630" cy="476" r="8"/><circle cx="652" cy="476" r="8"/><circle cx="674" cy="476" r="8"/>
  </g>

  <!-- one box carrying them, one box free -->
  <g transform="translate(792,242)">
    <path d="M0 34 L156 34 L182 12 L26 12 Z" fill="#eceadf" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="0" y="34" width="156" height="146" rx="9" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M156 34 L182 12 L182 158 L156 180 Z" fill="#e4e2d6" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="#6b8f2e">
      <rect x="22" y="60" width="52" height="8" rx="4"/><rect x="22" y="78" width="76" height="8" rx="4"/>
      <rect x="22" y="96" width="40" height="8" rx="4"/><rect x="22" y="114" width="64" height="8" rx="4"/>
      <rect x="22" y="132" width="88" height="8" rx="4"/><rect x="22" y="150" width="48" height="8" rx="4"/>
    </g>
  </g>
  <g transform="translate(1000,242)" opacity="0.5">
    <path d="M0 34 L156 34 L182 12 L26 12 Z" fill="#eceadf" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9 6"/>
    <rect x="0" y="34" width="156" height="146" rx="9" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5" stroke-dasharray="9 6"/>
    <path d="M156 34 L182 12 L182 158 L156 180 Z" fill="#e4e2d6" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="9 6"/>
  </g>
</svg>
