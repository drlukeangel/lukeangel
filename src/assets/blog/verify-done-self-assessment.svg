<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Self assessment">
  <rect x="1" y="1" width="998" height="468" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:14px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;fill:#5b616b}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>
  <defs>
    <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d24"/>
    </marker>
  </defs>

  <text class="h" x="36" y="42">what the agent can actually see</text>

  <!-- the context column -->
  <rect x="36" y="60" width="300" height="308" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="58" y="86">its own context</text>
  <g fill="#6b8f2e" fill-opacity="0.28" stroke="#1a1d24" stroke-width="1.5">
    <rect x="58" y="100" width="256" height="26" rx="4"/>
    <rect x="58" y="132" width="256" height="26" rx="4"/>
    <rect x="58" y="164" width="256" height="26" rx="4"/>
    <rect x="58" y="196" width="256" height="26" rx="4"/>
    <rect x="58" y="228" width="256" height="26" rx="4"/>
    <rect x="58" y="260" width="256" height="26" rx="4"/>
  </g>
  <text class="s" x="70" y="118">edit, and why it was right</text>
  <text class="s" x="70" y="150">edit, and why it was right</text>
  <text class="s" x="70" y="182">edit, and why it was right</text>
  <text class="s" x="70" y="214">edit, and why it was right</text>
  <text class="s" x="70" y="246">edit, and why it was right</text>
  <text class="s" x="70" y="278">edit, and why it was right</text>
  <text class="l" x="58" y="316">question: are you finished?</text>
  <text class="l" x="58" y="346" fill="#3a7d44">answer: yes</text>

  <!-- what's outside -->
  <path d="M336 214 L420 214" stroke="#1a1d24" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
  <text class="s" x="344" y="202">out of reach</text>

  <rect x="428" y="60" width="288" height="308" rx="8" fill="#7a808c" fill-opacity="0.08" stroke="#c14a3a" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="s" x="450" y="86">the running application</text>
  <text class="l" x="450" y="120">12 of 22 criteria pass</text>
  <text class="l" x="450" y="152">7 of 13 holdout probes broken</text>
  <text class="l" x="450" y="184">KeyError: 'due_date'</text>
  <text class="s" x="450" y="222">a field the app depends on</text>
  <text class="s" x="450" y="242">was deleted three edits ago</text>
  <text class="s" x="450" y="292" fill="#c14a3a">none of this is in the context</text>
  <text class="s" x="450" y="314" fill="#c14a3a">and no wording of the question</text>
  <text class="s" x="450" y="336" fill="#c14a3a">can put it there</text>

  <!-- the report -->
  <rect x="744" y="60" width="220" height="308" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="766" y="86">what it reported</text>
  <text class="l" x="766" y="126">"successfully</text>
  <text class="l" x="766" y="148">implemented all</text>
  <text class="l" x="766" y="170">required</text>
  <text class="l" x="766" y="192">functionality"</text>
  <text class="s" x="766" y="240">not a lie —</text>
  <text class="s" x="766" y="262">a sincere report</text>
  <text class="s" x="766" y="284">from the only</text>
  <text class="s" x="766" y="306">evidence it had</text>

  <text class="c" x="36" y="420">Completion is a claim about the world. The agent has only its account of the world.</text>
</svg>
