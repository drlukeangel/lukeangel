<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The scorecard">
  <defs>
    <pattern id="d2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#d2)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <!-- clipboard -->
  <g transform="translate(196,132)">
    <rect x="0" y="26" width="452" height="366" rx="14" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5"/>
    <rect x="152" y="0" width="148" height="52" rx="12" fill="#eceadf" stroke="#1a1d24" stroke-width="3.5"/>
    <rect x="186" y="14" width="80" height="24" rx="8" fill="#6b8f2e"/>

    <!-- three unticked boxes, descending width -->
    <g fill="none" stroke="#1a1d24" stroke-width="3">
      <rect x="48" y="104" width="42" height="42" rx="7"/>
      <rect x="48" y="192" width="42" height="42" rx="7"/>
      <rect x="48" y="280" width="42" height="42" rx="7"/>
    </g>
    <g fill="#7a808c" fill-opacity="0.55">
      <rect x="112" y="112" width="286" height="11" rx="5.5"/>
      <rect x="112" y="132" width="196" height="11" rx="5.5"/>
      <rect x="112" y="200" width="242" height="11" rx="5.5"/>
      <rect x="112" y="220" width="150" height="11" rx="5.5"/>
      <rect x="112" y="288" width="204" height="11" rx="5.5"/>
      <rect x="112" y="308" width="110" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- the boundary -->
  <path d="M736 118 L736 512" stroke="#1a1d24" stroke-width="3" stroke-dasharray="12 9" stroke-opacity="0.6" fill="none"/>

  <!-- sealed envelope, held outside -->
  <g transform="translate(826,232)">
    <rect x="0" y="0" width="248" height="166" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M0 12 L124 96 L248 12" fill="none" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="124" cy="104" r="30" fill="#6b8f2e" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M110 104 l10 11 l20 -22" fill="none" stroke="#fdfaf2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 148 L152 148" stroke="#1a1d24" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
