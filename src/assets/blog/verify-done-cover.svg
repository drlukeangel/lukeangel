<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The gate">
  <defs>
    <pattern id="da" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
    <marker id="vg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c14a3a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#da)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <!-- one agent, held at a closed barrier -->
  <circle cx="222" cy="330" r="46" fill="#6b8f2e" fill-opacity="0.28" stroke="#1a1d24" stroke-width="4"/>
  <g fill="#6b8f2e">
    <rect x="198" y="318" width="48" height="9" rx="4.5"/>
    <rect x="198" y="336" width="30" height="9" rx="4.5"/>
  </g>
  <path d="M268 330 L352 330" stroke="#1a1d24" stroke-width="4" fill="none"/>

  <rect x="360" y="176" width="34" height="308" rx="8" fill="#1a1d24"/>
  <g fill="#fdfaf2">
    <rect x="368" y="200" width="18" height="30" rx="4"/>
    <rect x="368" y="248" width="18" height="30" rx="4"/>
    <rect x="368" y="296" width="18" height="30" rx="4"/>
    <rect x="368" y="344" width="18" height="30" rx="4"/>
    <rect x="368" y="392" width="18" height="30" rx="4"/>
  </g>

  <!-- refusal loop back to the agent -->
  <path d="M356 400 C300 470 240 470 222 420 L222 382" stroke="#c14a3a" stroke-width="4.5" fill="none" marker-end="url(#vg)"/>

  <!-- the finish, behind the barrier -->
  <g transform="translate(452,282)">
    <rect x="0" y="0" width="112" height="96" rx="11" fill="#6b8f2e" fill-opacity="0.32" stroke="#3a7d44" stroke-width="4"/>
    <path d="M32 46 l16 18 l32 -38" fill="none" stroke="#3a7d44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the six-agent cluster, at an open barrier, idle -->
  <g opacity="0.85">
    <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5">
      <circle cx="754" cy="252" r="30"/><circle cx="836" cy="252" r="30"/><circle cx="918" cy="252" r="30"/>
      <circle cx="754" cy="330" r="30"/><circle cx="836" cy="330" r="30"/><circle cx="918" cy="330" r="30"/>
    </g>
    <g fill="#7a808c" fill-opacity="0.4">
      <rect x="738" y="248" width="32" height="7" rx="3.5"/><rect x="820" y="248" width="32" height="7" rx="3.5"/>
      <rect x="902" y="248" width="32" height="7" rx="3.5"/><rect x="738" y="326" width="32" height="7" rx="3.5"/>
      <rect x="820" y="326" width="32" height="7" rx="3.5"/><rect x="902" y="326" width="32" height="7" rx="3.5"/>
    </g>
    <path d="M948 290 L1030 290" stroke="#7a808c" stroke-width="3.5" fill="none" stroke-opacity="0.7"/>
    <!-- barrier standing open — nothing refuses them, and they stopped short anyway -->
    <g transform="rotate(50 1054 330)">
      <rect x="1040" y="180" width="28" height="150" rx="7" fill="#7a808c" fill-opacity="0.4" stroke="#7a808c" stroke-width="2.5"/>
    </g>
    <circle cx="1054" cy="330" r="9" fill="#7a808c" fill-opacity="0.55"/>
  </g>
</svg>
