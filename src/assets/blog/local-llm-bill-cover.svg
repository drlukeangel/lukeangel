<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The bill">
  <defs>
    <pattern id="d1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#d1)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <g transform="translate(0,42)">
    <!-- frame first, so pans and contents sit on top of it -->
    <g stroke="#1a1d24" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M359 206 L359 290"/>
      <path d="M841 206 L841 290"/>
      <path d="M359 206 L841 206"/>
      <path d="M600 206 L600 452"/>
      <path d="M508 452 L692 452"/>
    </g>

    <!-- pans -->
    <path d="M262 284 L456 284 L424 336 L294 336 Z" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M744 284 L938 284 L906 336 L776 336 Z" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- metered tokens, thinning as they pile up -->
    <g fill="#7a808c">
      <rect x="288" y="266" width="30" height="8" rx="4" fill-opacity="0.85"/>
      <rect x="326" y="266" width="20" height="8" rx="4" fill-opacity="0.8"/>
      <rect x="354" y="266" width="34" height="8" rx="4" fill-opacity="0.75"/>
      <rect x="396" y="266" width="18" height="8" rx="4" fill-opacity="0.7"/>
      <rect x="298" y="246" width="24" height="8" rx="4" fill-opacity="0.6"/>
      <rect x="330" y="246" width="32" height="8" rx="4" fill-opacity="0.52"/>
      <rect x="370" y="246" width="20" height="8" rx="4" fill-opacity="0.44"/>
      <rect x="308" y="226" width="30" height="8" rx="4" fill-opacity="0.36"/>
      <rect x="346" y="226" width="22" height="8" rx="4" fill-opacity="0.28"/>
      <rect x="376" y="226" width="16" height="8" rx="4" fill-opacity="0.22"/>
      <rect x="318" y="206" width="26" height="8" rx="4" fill-opacity="0.16"/>
      <rect x="352" y="206" width="18" height="8" rx="4" fill-opacity="0.11"/>
      <rect x="328" y="186" width="22" height="8" rx="4" fill-opacity="0.07"/>
    </g>

    <!-- one box, bought outright -->
    <g>
      <path d="M772 224 L882 224 L906 204 L796 204 Z" fill="#eceadf" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
      <rect x="772" y="224" width="110" height="58" rx="7" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3"/>
      <path d="M882 224 L906 204 L906 262 L882 282 Z" fill="#e4e2d6" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#6b8f2e">
        <rect x="788" y="240" width="48" height="7" rx="3.5"/>
        <rect x="788" y="256" width="30" height="7" rx="3.5"/>
      </g>
      <g fill="#1a1d24" fill-opacity="0.3">
        <circle cx="858" cy="270" r="3.5"/><circle cx="870" cy="270" r="3.5"/>
      </g>
    </g>

    <circle cx="600" cy="196" r="13" fill="#6b8f2e" stroke="#1a1d24" stroke-width="3.5"/>
