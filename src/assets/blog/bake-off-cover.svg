<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The bake-off">
  <defs>
    <pattern id="d8" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a1d24" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fdfaf2"/>
  <rect width="1200" height="630" fill="url(#d8)"/>
  <rect x="0" y="0" width="24" height="630" fill="#6b8f2e"/>

  <!-- column 1: hand-rolled -->
  <g transform="translate(276,150)">
    <g fill="#7a808c" fill-opacity="0.16" stroke="#1a1d24" stroke-width="3">
      <rect x="0" y="56" width="160" height="60"/>
      <rect x="0" y="116" width="160" height="60"/>
      <rect x="0" y="176" width="160" height="60"/>
      <rect x="0" y="236" width="160" height="60"/>
      <rect x="0" y="296" width="160" height="60"/>
    </g>
    <rect x="0" y="0" width="160" height="56" rx="10" fill="#6b8f2e" fill-opacity="0.75" stroke="#1a1d24" stroke-width="3.5"/>
    <rect x="0" y="0" width="160" height="356" rx="10" fill="none" stroke="#1a1d24" stroke-width="3.5"/>
  </g>

  <!-- column 2: langgraph, with the thin band -->
  <g transform="translate(520,150)">
    <g fill="#7a808c" fill-opacity="0.16" stroke="#1a1d24" stroke-width="3">
      <rect x="0" y="80" width="160" height="60"/>
      <rect x="0" y="140" width="160" height="60"/>
      <rect x="0" y="200" width="160" height="60"/>
      <rect x="0" y="260" width="160" height="60"/>
      <rect x="0" y="320" width="160" height="36"/>
    </g>
    <rect x="0" y="56" width="160" height="24" fill="#c87533" fill-opacity="0.85" stroke="#1a1d24" stroke-width="3"/>
    <rect x="0" y="0" width="160" height="56" rx="10" fill="#6b8f2e" fill-opacity="0.75" stroke="#1a1d24" stroke-width="3.5"/>
    <rect x="0" y="0" width="160" height="356" rx="10" fill="none" stroke="#1a1d24" stroke-width="3.5"/>
  </g>

  <!-- column 3: pydantic, short cap -->
  <g transform="translate(764,150)">
    <g fill="#7a808c" fill-opacity="0.16" stroke="#1a1d24" stroke-width="3">
      <rect x="0" y="56" width="160" height="60"/>
      <rect x="0" y="116" width="160" height="60"/>
      <rect x="0" y="176" width="160" height="60"/>
      <rect x="0" y="236" width="160" height="60"/>
      <rect x="0" y="296" width="160" height="60"/>
    </g>
    <rect x="0" y="0" width="160" height="56" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-width="3.5" stroke-dasharray="9 6"/>
    <rect x="0" y="0" width="160" height="356" rx="10" fill="none" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M28 28 L132 28" stroke="#c14a3a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M240 530 L996 530" stroke="#1a1d24" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
</svg>
