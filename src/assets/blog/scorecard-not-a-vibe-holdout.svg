<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="The holdout tripwire">
  <rect x="1" y="1" width="998" height="468" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:15px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:13px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#5b616b}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d24"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="36" y="146" width="212" height="152" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="h" x="56" y="180">at the start</text>
  <text class="s" x="56" y="210">visible contract</text>
  <text class="l" x="56" y="232">partly failing</text>
  <text class="s" x="56" y="256">held-out probes</text>
  <text class="l" x="56" y="280" fill="#3a7d44">all pass</text>

  <path d="M248 190 L318 138" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#m2)"/>
  <path d="M248 240 L318 296" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#m2)"/>

  <!-- good ending -->
  <rect x="326" y="58" width="300" height="122" rx="8" fill="#fdfaf2" stroke="#3a7d44" stroke-width="3"/>
  <text class="h" x="346" y="88" fill="#3a7d44">a genuine repair</text>
  <text class="s" x="346" y="116">visible contract</text>
  <text class="l" x="346" y="138">rises</text>
  <text class="s" x="346" y="162">held-out probes</text>
  <text class="l" x="470" y="162" fill="#3a7d44">still all pass</text>
  <g stroke="#3a7d44" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M572 108 l11 12 l22 -25"/>
  </g>

  <!-- bad ending -->
  <rect x="326" y="250" width="300" height="122" rx="8" fill="#fdfaf2" stroke="#c14a3a" stroke-width="3"/>
  <text class="h" x="346" y="280" fill="#c14a3a">a failed run</text>
  <text class="s" x="346" y="308">visible contract</text>
  <text class="l" x="346" y="330">rises just as much</text>
  <text class="s" x="346" y="354">held-out probes</text>
  <text class="l" x="470" y="354" fill="#c14a3a">one flips to fail</text>
  <g stroke="#c14a3a" stroke-width="3.5" stroke-linecap="round">
    <path d="M574 298 L602 322"/><path d="M602 298 L574 322"/>
  </g>

  <!-- the rule -->
  <rect x="672" y="122" width="290" height="182" rx="8" fill="#6b8f2e" fill-opacity="0.12" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="h" x="694" y="154">the holdout starts full</text>
  <text class="s" x="694" y="184">so it cannot measure</text>
  <text class="s" x="694" y="204">improvement —</text>
  <text class="l" x="694" y="234">it can only go down.</text>
  <text class="s" x="694" y="264">that makes it a tripwire,</text>
  <text class="s" x="694" y="284">not a second scoreboard.</text>
  <path d="M626 138 L668 176" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#m2)"/>
  <path d="M626 300 L668 262" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#m2)"/>

  <text class="c" x="36" y="422">A tripwire that is already tripped tells you nothing.</text>
</svg>
