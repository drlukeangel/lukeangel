<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Hourly rate">
  <rect x="1" y="1" width="998" height="468" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:16px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:13px;fill:#5b616b}
    .b{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:19px;fill:#1a1d24;font-weight:700}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>

  <!-- chain -->
  <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5">
    <rect x="38" y="70" width="176" height="76" rx="8"/>
    <rect x="266" y="70" width="176" height="76" rx="8"/>
    <rect x="494" y="70" width="176" height="76" rx="8"/>
    <rect x="722" y="70" width="222" height="76" rx="8"/>
  </g>
  <text class="s" x="60" y="98">purchase</text>
  <text class="b" x="60" y="126">$9,400</text>
  <text class="s" x="288" y="98">70% written off</text>
  <text class="b" x="288" y="126">$6,580</text>
  <text class="s" x="516" y="98">36 months</text>
  <text class="b" x="516" y="126">$182.78 / mo</text>
  <text class="s" x="744" y="98">200 busy hours / mo</text>
  <text class="b" x="744" y="126">$0.91 / hour</text>

  <g stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M214 108 L262 108"/>
    <path d="M442 108 L490 108"/>
    <path d="M670 108 L718 108"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d24"/>
    </marker>
  </defs>

  <!-- power branch -->
  <rect x="38" y="196" width="404" height="70" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="s" x="60" y="222">240 W  x  $0.15 / kWh</text>
  <text class="b" x="60" y="250">$0.036 / hour</text>

  <!-- sum -->
  <rect x="494" y="196" width="450" height="70" rx="8" fill="#fdfaf2" stroke="#6b8f2e" stroke-width="3.5"/>
  <text class="s" x="516" y="222">true cost of one machine-hour</text>
  <text class="b" x="516" y="250">~$0.95 / machine-hour</text>
  <path d="M442 231 L490 231" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M833 146 L833 194" stroke="#1a1d24" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- proportion bar -->
  <text class="l" x="38" y="330">where the money goes</text>
  <rect x="38" y="346" width="870" height="40" rx="6" fill="#6b8f2e" stroke="#1a1d24" stroke-width="2.5"/>
  <rect x="874" y="346" width="34" height="40" fill="#c14a3a" fill-opacity="0.6" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="l" x="52" y="373" fill="#ffffff">amortised hardware  96%</text>
  <text class="s" x="700" y="410">energy  4%</text>
  <path d="M886 392 L886 400 L790 400" stroke="#1a1d24" stroke-opacity="0.5" stroke-width="2" fill="none"/>

  <text class="c" x="38" y="446">Power is a rounding error. The purchase, spread thin, is the whole bill.</text>
</svg>
