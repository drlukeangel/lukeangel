<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Three holes in one guard">
  <rect x="1" y="1" width="998" height="468" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:13px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;fill:#5b616b}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>

  <!-- three iterations -->
  <g>
    <rect x="36" y="56" width="290" height="150" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
    <text class="h" x="58" y="84">guard v1</text>
    <text class="l" x="58" y="112">checks: `import app`</text>
    <text class="s" x="58" y="144">a model writes valid Python</text>
    <text class="s" x="58" y="164">that raises only when the</text>
    <text class="s" x="58" y="184">factory is called</text>
    <rect x="36" y="56" width="290" height="150" rx="8" fill="none" stroke="#c14a3a" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  <g>
    <rect x="354" y="56" width="290" height="150" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
    <text class="h" x="376" y="84">guard v2</text>
    <text class="l" x="376" y="112">calls create_app(), on EDIT</text>
    <text class="s" x="376" y="144">a model bypasses EDIT and</text>
    <text class="s" x="376" y="164">writes the file through</text>
    <text class="s" x="376" y="184">RUN python3 &lt;&lt; 'EOF'</text>
    <rect x="354" y="56" width="290" height="150" rx="8" fill="none" stroke="#c14a3a" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  <g>
    <rect x="672" y="56" width="292" height="150" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
    <text class="h" x="694" y="84">guard v3</text>
    <text class="l" x="694" y="112">covers RUN, fingerprints *.py</text>
    <text class="s" x="694" y="144">a RUN writes a non-Python</text>
    <text class="s" x="694" y="164">file the app depends on —</text>
    <text class="s" x="694" y="184">invisible to the fingerprint</text>
    <rect x="672" y="56" width="292" height="150" rx="8" fill="none" stroke="#c14a3a" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>

  <text class="s" x="36" y="236">each patch closes the exact spot the last failure appeared</text>

  <!-- what should have been checked -->
  <rect x="36" y="262" width="928" height="112" rx="8" fill="#6b8f2e" fill-opacity="0.14" stroke="#3a7d44" stroke-width="3"/>
  <text class="h" x="58" y="292" fill="#3a7d44">the property none of the three ever tested</text>
  <text class="l" x="58" y="322">can the running application serve a request?</text>
  <text class="s" x="58" y="350">one request probe after each edit would have caught all three — and handed the model an error it could act on</text>

  <text class="c" x="36" y="424">Each version verified a proxy. The next failure came through a door two feet to the left.</text>
</svg>
