<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Orchestrated versus solo">
  <rect x="1" y="1" width="998" height="558" rx="10" fill="#fdfaf2" stroke="#1a1d24" stroke-opacity="0.12" stroke-width="2"/>
  <style>
    .h{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:15px;fill:#1a1d24;font-weight:700}
    .l{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:13px;fill:#1a1d24}
    .s{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;fill:#5b616b}
    .b{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:17px;fill:#1a1d24;font-weight:700}
    .c{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;fill:#5b616b}
  </style>
  <defs>
    <marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d24"/>
    </marker>
  </defs>

  <path d="M548 24 L548 470" stroke="#1a1d24" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="h" x="36" y="42">orchestrated arm</text>
  <text class="h" x="596" y="42">solo control</text>

  <!-- LEFT stack -->
  <rect x="36" y="60" width="476" height="34" rx="6" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="56" y="82">plan  →  partition by file</text>

  <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5">
    <rect x="36" y="112" width="86" height="40" rx="6"/><rect x="134" y="112" width="86" height="40" rx="6"/>
    <rect x="232" y="112" width="86" height="40" rx="6"/><rect x="330" y="112" width="86" height="40" rx="6"/>
    <rect x="428" y="112" width="84" height="40" rx="6"/>
  </g>
  <text class="s" x="36" y="168">workers, in waves</text>

  <g fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5">
    <rect x="36" y="184" width="86" height="36" rx="6"/><rect x="134" y="184" width="86" height="36" rx="6"/>
    <rect x="232" y="184" width="86" height="36" rx="6"/><rect x="330" y="184" width="86" height="36" rx="6"/>
    <rect x="428" y="184" width="84" height="36" rx="6"/>
  </g>
  <text class="s" x="36" y="236">five expert reviewers</text>

  <rect x="36" y="250" width="476" height="34" rx="6" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="56" y="272">synthesiser  →  one verdict</text>
  <rect x="36" y="296" width="476" height="34" rx="6" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="56" y="318">gate: commit / partial / revert</text>
  <path d="M512 313 C544 313 544 78 520 78" stroke="#1a1d24" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#m6)"/>
  <text class="s" x="316" y="350">repeat, round after round</text>

  <rect x="36" y="366" width="476" height="76" rx="8" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="b" x="58" y="398">881 turns   ·   237 min</text>
  <text class="s" x="58" y="424">300k completion tokens</text>

  <!-- RIGHT stack -->
  <rect x="596" y="60" width="368" height="34" rx="6" fill="#fdfaf2" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="s" x="616" y="82">read the contract</text>
  <rect x="596" y="112" width="368" height="108" rx="6" fill="#6b8f2e" fill-opacity="0.16" stroke="#1a1d24" stroke-width="2.5"/>
  <text class="l" x="616" y="150">one agent</text>
  <text class="s" x="616" y="176">edit  →  run the criteria  →  edit</text>
  <path d="M964 166 C990 166 990 78 972 78" stroke="#1a1d24" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#m6)"/>

  <rect x="596" y="366" width="368" height="76" rx="8" fill="#fdfaf2" stroke="#6b8f2e" stroke-width="3"/>
  <text class="b" x="618" y="398">28 turns   ·   12 min</text>
  <text class="s" x="618" y="424">5.4k completion tokens</text>

  <!-- identical results -->
  <g>
    <rect x="196" y="470" width="156" height="40" rx="7" fill="#6b8f2e" fill-opacity="0.3" stroke="#3a7d44" stroke-width="3"/>
    <text class="l" x="216" y="496">22/22 · 13/13</text>
    <rect x="702" y="470" width="156" height="40" rx="7" fill="#6b8f2e" fill-opacity="0.3" stroke="#3a7d44" stroke-width="3"/>
    <text class="l" x="722" y="496">22/22 · 13/13</text>
  </g>
  <text class="c" x="380" y="544">same result, either way</text>
</svg>
